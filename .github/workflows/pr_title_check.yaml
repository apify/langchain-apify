name: PR title

on:
  # Also runs when the title is edited, which the checks in `on_pull_request.yaml` don't react to.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_title_check:
    name: PR title check
    runs-on: ubuntu-latest
    steps:
      - uses: apify/actions/pr-title-check@v1.6.2
