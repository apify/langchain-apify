[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "langchain-apify"
version = "0.2.0"
description = "An integration package connecting Apify and LangChain"
authors = [{ name = "Apify Technologies s.r.o.", email = "support@apify.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain-core>=0.3.15,<2.0.0",
    "apify-client>=3.3.0,<4.0.0",
    "impit>=0.14.0,<1.0.0",
]

[dependency-groups]
dev = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-openai>=0.3.2,<0.4.0",
    "poethepoet<1.0.0",
    "pytest>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.23.2,<0.24.0",
    "pytest-cov<8.0.0",
    "pytest-socket>=0.7.0,<0.8.0",
    "pytest-watcher>=0.3.4,<0.4.0",
    "langchain-tests>=0.3.5,<0.4.0",
    "ruff~=0.17.0",
    "ty~=0.0.0",
    "typos<2.0.0",
]

[project.urls]
"Apify Homepage" = "https://apify.com"
"Repository" = "https://github.com/apify/langchain-apify"
"Source Code" = "https://github.com/apify/langchain-apify/tree/main/"
"Release Notes" = "https://github.com/apify/langchain-apify/releases?expanded=true"
"Issue Tracker" = "https://github.com/apify/langchain-apify/issues"

[tool.uv.build-backend]
# The module, pyproject.toml, README and LICENSE are included in the sdist by default.
source-include = ["CHANGELOG.md", "CONTRIBUTING.md", "llms.txt", "tests/**"]

# Run tasks with: uv run poe <task>
[tool.poe.tasks]
clean = { cmd = "rm -rf .coverage .pytest_cache .ruff_cache .ty_cache build dist htmlcov", help = "Remove build artifacts and clean caches" }
install-dev = { cmd = "uv sync", help = "Install development dependencies" }
build = { cmd = "uv build", help = "Build the package" }
type-check = { cmd = "uv run ty check", help = "Run the type checker" }
spell-check = { cmd = "uv run typos", help = "Check spelling" }
unit-tests = { cmd = "uv run pytest --disable-socket --allow-unix-socket tests/unit_tests", help = "Run unit tests" }
unit-tests-cov = { cmd = "uv run pytest --disable-socket --allow-unix-socket --cov=langchain_apify --cov-report=xml:coverage-unit.xml tests/unit_tests", help = "Run unit tests with an XML coverage report" }
integration-tests = { cmd = "uv run pytest tests/integration_tests", help = "Run integration tests against the Apify platform" }
check-code = { sequence = ["lint", "type-check", "spell-check", "check-imports", "unit-tests"], help = "Run all checks and unit tests" }

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"
help = "Run the linter and check formatting"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"
help = "Fix lint issues and format code"

[tool.poe.tasks.check-imports]
shell = "uv run python scripts/check_imports.py $(find src/langchain_apify -name '*.py')"
help = "Check that every module imports on its own"

[tool.ruff]
line-length = 120
include = ["**/*.py", "**/*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in {filename}
    "BLE001",  # Do not catch blind exception
    "C901",    # `{name}` is too complex
    "COM812",  # This rule may cause conflicts when used with the formatter
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
    "EM",      # flake8-errmsg
    "FIX",     # flake8-fixme
    "G004",    # Logging statement uses f-string
    "ISC001",  # This rule may cause conflicts when used with the formatter
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PTH",     # flake8-use-pathlib
    "TD002",   # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Unused imports
]
"**/{scripts}/*" = [
    "D",       # Everything from the pydocstyle
    "INP001",  # File {filename} is part of an implicit namespace package, add an __init__.py
    "T201",    # Use of `print` statement
    "PERF203", # try`-`except` within a loop incurs performance overhead
    "BLE001",  # Do not catch blind exception: `Exception`
]
"**/{docs/examples}/*" = [
    "D",       # Everything from the pydocstyle
    "INP001",  # File {filename} is part of an implicit namespace package, add an __init__.py
    "T201",    # Use of `print` statement
]
"**/{tests}/*" = [
    "D",       # Everything from the pydocstyle
    "INP001",  # File {filename} is part of an implicit namespace package, add an __init__.py
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password assigned to: "{name}"
    "S106",    # Possible hardcoded password assigned to argument: "{name}"
    "SLF001",  # Private member accessed: `{name}`
    "T20",     # flake8-print
    "TRY301",  # Abstract `raise` to an inner function
    "TID252",  # Prefer absolute imports over relative imports from parent modules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, so their imports can't move into a TYPE_CHECKING block.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "langchain_core.tools.BaseTool"]

[tool.ruff.lint.pylint]
max-branches = 18

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests", "docs/examples"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"

[tool.uv]
override-dependencies = ["vcrpy>=8.2.1,<9.0.0"]
