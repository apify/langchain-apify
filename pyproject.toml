[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-apify"
version = "0.2.0"
description = "An integration package connecting Apify and LangChain"
authors = [{ name = "Apify Technologies s.r.o.", email = "support@apify.com" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain-core>=0.3.15,<2.0.0",
    "apify-client>=3.3.0,<4.0.0",
    "impit>=0.14.0,<1.0.0",
]

[dependency-groups]
dev = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-openai>=0.3.2,<0.4.0",
    "poethepoet<1.0.0",
    "pytest>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.23.2,<0.24.0",
    "pytest-cov<8.0.0",
    "pytest-socket>=0.7.0,<0.8.0",
    "pytest-watcher>=0.3.4,<0.4.0",
    "langchain-tests>=0.3.5,<0.4.0",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<2.0.0",
    "codespell>=2.2.6,<3.0.0",
]

[project.urls]
"Apify Homepage" = "https://apify.com"
"Repository" = "https://github.com/apify/langchain-apify"
"Source Code" = "https://github.com/apify/langchain-apify/tree/main/"
"Release Notes" = "https://github.com/apify/langchain-apify/releases?expanded=true"
"Issue Tracker" = "https://github.com/apify/langchain-apify/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_apify"]

# Source distribution - explicit allowlist so local-only paths (dist/, .venv/,
# res_lc*.txt, docs/, etc.) never reach PyPI.
[tool.hatch.build.targets.sdist]
include = [
    "/langchain_apify",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/llms.txt",
]

# Run tasks with: uv run poe <task>
[tool.poe.tasks]
clean = { cmd = "rm -rf .coverage .mypy_cache .pytest_cache .ruff_cache build dist htmlcov", help = "Remove build artifacts and clean caches" }
install-dev = { cmd = "uv sync", help = "Install development dependencies" }
build = { cmd = "uv build", help = "Build the package" }
type-check = { cmd = "uv run mypy langchain_apify", help = "Run the type checker" }
spell-check = { cmd = "uv run codespell --toml pyproject.toml", help = "Check spelling" }
unit-tests = { cmd = "uv run pytest --disable-socket --allow-unix-socket tests/unit_tests", help = "Run unit tests" }
unit-tests-cov = { cmd = "uv run pytest --disable-socket --allow-unix-socket --cov=langchain_apify --cov-report=xml:coverage-unit.xml tests/unit_tests", help = "Run unit tests with an XML coverage report" }
integration-tests = { cmd = "uv run pytest tests/integration_tests", help = "Run integration tests against the Apify platform" }
check-code = { sequence = ["lint", "type-check", "spell-check", "check-imports", "unit-tests"], help = "Run all checks and unit tests" }

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"
help = "Run the linter and check formatting"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"
help = "Fix lint issues and format code"

[tool.poe.tasks.check-imports]
shell = "uv run python scripts/check_imports.py $(find langchain_apify -name '*.py')"
help = "Check that every module imports on its own"

[tool.mypy]
disallow_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",     # Missing docstring in public module
    "D104",     # Missing docstring in public package
    "D107",     # Missing docstring in `__init__`
    "COM812",   # Missing trailing comma
    "ISC001",   # Single line implicit concatenation
    "RUF101",   # redirected-noqa
    "S105",     # Possible hard-coded password
    "S106",     # Checks for potential uses of hardcoded passwords in function calls.
    "CPY001",   # missing copyright notice
    "TCH003",   # Move standard library import into type-checking block
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Unused imports
]
"**/{scripts}/*" = [
    "D",       # Everything from the pydocstyle
    "INP001",  # File {filename} is part of an implicit namespace package, add an __init__.py
    "T201",    # Use of `print` statement
    "PERF203", # try`-`except` within a loop incurs performance overhead
    "BLE001",  # Do not catch blind exception: `Exception`
]
"**/{docs/examples}/*" = [
    "D",       # Everything from the pydocstyle
    "INP001",  # File {filename} is part of an implicit namespace package, add an __init__.py
    "T201",    # Use of `print` statement
]
"**/{tests}/*" = [
    "D",       # Everything from the pydocstyle
    "INP001",  # File {filename} is part of an implicit namespace package, add an __init__.py
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "S101",    # Use of assert detected
    "SLF001",  # Private member accessed: `{name}`
    "T20",     # flake8-print
    "TRY301",  # Abstract `raise` to an inner function
    "TID252",  # Prefer absolute imports over relative imports from parent modules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"

[tool.uv]
override-dependencies = ["vcrpy>=8.2.1,<9.0.0"]
